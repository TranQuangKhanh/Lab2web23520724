services:
  - type: web
    name: jsx-without-react
    env: node
    branch: main
    # Install devDependencies so tsc/vite are available during build
    installCommand: "npm ci --include=dev"
    buildCommand: "npm run build"
    # Start command for Render to run - server.js will bind to $PORT
  startCommand: "node server.cjs"
    # The repo builds into `dist` which our server serves
    publishPath: "dist"
